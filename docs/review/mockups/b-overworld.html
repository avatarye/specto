<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Specto mockup - B Calm Canvas - overworld</title>
<style>
:root{
  --bg:#eeebe5; --card:#fffdfa; --ink:#2a2826; --mute:#8a847b; --soft:#b9b2a7; --line:#e4dfd6;
  --scout:#6b5bd2;
  --time:#d49a2a; --cam:#2f9aa8; --item:#4f9d5d; --sel:#c2508f;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --mono:"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{background:linear-gradient(135deg,#c9d6df,#e3d9cc 60%,#d8cfc4);font:13.5px/1.4 var(--ui);color:var(--ink)}
.win{position:absolute;left:14px;top:12px;width:1572px;height:976px;background:var(--bg);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(60,50,40,.28),0 0 0 1px rgba(0,0,0,.08);display:flex;flex-direction:column}
.title{height:34px;flex:none;display:flex;align-items:center;padding-left:14px;color:#6f695f;font-size:12.5px;background:#ebe8e3}
.title .caps{margin-left:auto;display:flex;height:100%}
.title .caps span{width:46px;display:flex;align-items:center;justify-content:center;color:#6f695f}
.cv{flex:1;position:relative;overflow:hidden;background-color:#e9ebee;background-image:radial-gradient(rgba(70,80,100,.17) 1.1px,transparent 1.3px);background-size:22px 22px}
.wire-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
.wire-label{font:600 12px var(--ui)}
.wire-label-bg{fill:#fffdfa}
.float{position:absolute;z-index:10;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(40,40,60,.08);font-size:13px}
.av{width:22px;height:22px;border-radius:50%;background:var(--scout);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btnp{padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:13px}
.btns{padding:7px 16px;border-radius:999px;background:var(--scout);color:#fff;font-size:13px;font-weight:600}
.btng{padding:6px 14px;border-radius:999px;box-shadow:0 0 0 1px #d6d0c6;color:#4a463f;font-size:13px;background:#fff}
.tools{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:10;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(40,40,60,.12);padding:6px;display:flex;flex-direction:column;gap:4px}
.tools span{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.tools span.on{background:#ece9fb}
/* frames */
.fpill{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:13px;white-space:nowrap}
.fpill .ic{width:22px;height:22px;border-radius:7px;background:#5b8def;display:flex;align-items:center;justify-content:center}
.fpill .m{color:var(--mute);font-size:12.5px}
.frame{position:absolute;background:rgba(255,253,250,.75);border-radius:20px;box-shadow:0 2px 4px rgba(60,50,40,.05),0 12px 36px rgba(60,50,40,.10);z-index:2}
.pn{position:absolute;background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(60,50,40,.08),0 3px 10px rgba(60,50,40,.06);z-index:3;overflow:hidden;display:flex;flex-direction:column}
.pn .hd{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12.5px;white-space:nowrap}
.pn .hd b{font-weight:600}
.pn .hd .s{color:var(--mute);font-size:11.5px}
.pn .hd .age{margin-left:auto;color:var(--soft);font-size:11px}
.pn .bd{flex:1;margin:0 7px 7px;border-radius:8px;overflow:hidden;position:relative;background:#f4f1ec}
.pn .bd canvas{display:block;width:100%;height:100%;filter:saturate(.75) brightness(1.04);opacity:.9}
.pn .col{position:absolute;left:6px;bottom:6px;font-size:11px;color:#4a463f;background:rgba(255,253,250,.92);padding:1px 8px;border-radius:999px}
.pn.prop{background:rgba(255,253,250,.5);box-shadow:none;outline:1.6px dashed var(--scout);outline-offset:-1.6px}
.pn.prop .hd,.pn.prop .bd{opacity:.7}
.pn.parked{opacity:.8}
.ptag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#4b3fa6;background:#efebfd;padding:1px 8px;border-radius:999px}
.port{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;z-index:7;transform:translate(-50%,-50%)}
.port:after{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.port{box-shadow:0 0 0 1.5px var(--c)}
.fake{padding:8px 10px;font-size:11.5px;color:#7a746b;line-height:1.7}
.fake i{display:block;height:6px;border-radius:3px;background:#e6e0d6;margin:6px 0}
.region{position:absolute;border-radius:24px;z-index:1}
.region .rl{position:absolute;left:20px;top:14px;font-size:14px;font-weight:600;color:#7a6a3c}
.sticky{position:absolute;z-index:5;background:#fff3b8;border-radius:4px 4px 14px 4px;box-shadow:0 4px 12px rgba(120,100,30,.18);padding:12px 14px;font-size:13px;color:#5b4d1f;transform:rotate(-1.5deg)}
.cursor{position:absolute;z-index:20;pointer-events:none}
.cursor .nm{position:absolute;left:16px;top:18px;background:var(--scout);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px 999px 999px 4px;white-space:nowrap;box-shadow:0 3px 10px rgba(107,91,210,.35)}
.cursor .nm small{font-weight:400;opacity:.85}
.bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(40,40,60,.16),0 0 0 1px rgba(107,91,210,.15);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:#f4f1fd;color:#4b3fa6;border:1px dashed #c9bff2}
.chip.cur{background:#e9e4fc;border-style:solid;border-color:var(--scout)}
.paused{background:#3a3f4b;color:#fff}
.comment{position:absolute;z-index:9;background:#fff;border-radius:14px 14px 14px 4px;box-shadow:0 6px 20px rgba(40,40,60,.14);padding:10px 14px;font-size:13px;width:250px}
.comment .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute);margin-bottom:4px}
.selbox{position:absolute;z-index:8;border:1.5px solid #3b82f6;border-radius:14px;background:rgba(59,130,246,.04)}
</style>
</head>
<body>
<div class="win">
  <div class="title">Specto<div class="caps"><span>&#8212;</span><span>&#9744;</span><span>&#10005;</span></div></div>
  <div class="cv" id="cv" data-wire-root>
    <svg class="wire-layer"></svg>
    <div class="float" style="left:18px;top:16px"><span class="pill"><span style="width:22px;height:22px;border-radius:7px;background:#5b8def;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">r</span><b style="font-weight:600">robotA</b><span style="color:var(--soft)">/</span><span style="color:var(--mute)">Overworld</span></span></div>
    <div class="float" style="left:50%;top:16px;transform:translateX(-50%)"><span class="pill paused"><svg width="10" height="12"><rect x="0" y="0" width="3.5" height="12" rx="1" fill="#fff"/><rect x="6.5" y="0" width="3.5" height="12" rx="1" fill="#fff"/></svg>Paused &middot; snapshots from 0:14 ago</span></div>
    <div class="float" style="right:18px;top:16px"><span class="pill" style="padding:5px 10px"><span class="av" style="background:#d07a4a">Y</span><span class="av">S</span><span style="color:var(--mute);font-size:12.5px">you + Scout</span></span><span class="btng">Normal view &nbsp;<span style="color:var(--soft)">Tab</span></span><span class="btnp">Ask agent</span></div>
    <div class="tools">
      <span class="on"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M3 2l9 6-4 1 2 5-2 1-2-5-3 3z" fill="#4b3fa6"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="3" fill="none" stroke="#6f695f" stroke-width="1.4"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16"><path d="M2 12C6 12 8 4 14 4" fill="none" stroke="#6f695f" stroke-width="1.4"/><circle cx="2.5" cy="12" r="1.8" fill="#6f695f"/><circle cx="13.5" cy="4" r="1.8" fill="#6f695f"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="#fff3b8" stroke="#b8a24a"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16"><path d="M3 4h10M3 8h7M3 12h9" stroke="#6f695f" stroke-width="1.4"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16"><path d="M2 13l3-1 8-8-2-2-8 8z" fill="none" stroke="#6f695f" stroke-width="1.4"/></svg></span>
    </div>
    <div class="float" style="right:18px;bottom:26px"><span class="pill" style="padding:6px 12px;color:var(--mute)">&minus; &nbsp;38% &nbsp;+</span></div>
    <div class="bar">
      <span class="av">S</span><span style="font-weight:600">3 proposals</span><span style="color:var(--mute);font-size:12.5px">Scout &middot; turn 12</span>
      <span class="chip cur">+ Controls panel</span><span class="chip">Gallery: front camera only</span><span class="chip">Video follows time offset</span>
      <span class="btns">Accept all</span><span class="btng">Step through</span><span class="btng" style="color:#9a5a3a">Discard</span>
    </div>
  </div>
</div>
<script>
const C = { time: '#d49a2a', cam: '#2f9aa8', item: '#4f9d5d', sel: '#c2508f', prop: '#6b5bd2' };
const cv = document.getElementById('cv');
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function place(e, x, y, w, h) { Object.assign(e.style, { left: x + 'px', top: y + 'px' }); if (w) e.style.width = w + 'px'; if (h) e.style.height = h + 'px'; cv.appendChild(e); return e; }
function frame(x, y, w, h, name, meta, color) {
  place(el('div', 'frame'), x, y, w, h);
  place(el('div', 'fpill', `<span class="ic" style="background:${color || '#5b8def'}"><svg width="12" height="12" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M5 14h6" stroke="#fff" stroke-width="1.6"/></svg></span><b style="font-weight:600">${name}</b><span class="m">${meta}</span>`), x + 14, y - 40);
}
function panel(s) {
  const p = place(el('div', 'pn ' + (s.cls || '')), s.x, s.y, s.w, s.h);
  p.appendChild(el('div', 'hd', `<b>${s.t}</b><span class="s">${s.sub || ''}</span>${s.tag ? `<span class="ptag" style="margin-left:auto">${s.tag}</span>` : `<span class="age">${s.age || '0:14'}</span>`}`));
  const bd = el('div', 'bd');
  bd.innerHTML = s.draw ? `<canvas data-draw="${s.draw}" data-seed="${s.seed || 1}" ${s.opts ? `data-opts='${JSON.stringify(s.opts)}'` : ''}></canvas>` : `<div class="fake">${s.fake || ''}</div>`;
  if (s.col) bd.appendChild(el('span', 'col', s.col));
  p.appendChild(bd);
  (s.ports || []).forEach(pt => {
    const d = el('div', 'port'); d.id = pt.id; d.dataset.side = pt.side; d.style.setProperty('--c', C[pt.ch]);
    const X = pt.side === 'l' ? s.x : pt.side === 'r' ? s.x + s.w : s.x + s.w * pt.f;
    const Y = pt.side === 't' ? s.y : pt.side === 'b' ? s.y + s.h : s.y + s.h * pt.f;
    place(d, X, Y);
  });
}
// region behind
const rg = place(el('div', 'region', '<span class="rl">run 7 notes</span>'), 60, 640, 620, 250); rg.style.background = 'rgba(244,214,120,.20)';
const rg2 = place(el('div', 'region', '<span class="rl" style="color:#3f6f78">ideas</span>'), 1040, 610, 450, 190); rg2.style.background = 'rgba(120,190,200,.16)';
// Review frame 1920x1080 -> 800x450 area
const RX = 128, RY = 96;
frame(RX, RY, 800, 470, 'Review', 'Monitor 1 &middot; 1920&times;1080');
const x0 = RX + 14, y0 = RY + 14;
panel({ x: x0, y: y0, w: 450, h: 230, t: '3D scan', sub: 'USD &middot; lidar1', draw: 'cloud', seed: 3, opts: { bg: '#efeae2', bg2: '#f8f6f2', cmap: 'calm', grid: 'rgba(60,50,40,0.07)', ego: '#2a2826', frustum: '#2f9aa8', size: 1.0, alpha: 0.7, density: 0.5, gizmo: false }, col: 'lidar1',
  ports: [{ id: 'usd-cam', side: 't', f: 0.82, ch: 'cam' }, { id: 'usd-time', side: 'l', f: 0.7, ch: 'time' }] });
panel({ x: x0 + 460, y: y0, w: 312, h: 230, t: 'Route', sub: 'Map &middot; gps + roads', draw: 'map', seed: 4, opts: { theme: 'light', block: 34, chrome: false, labelSize: 8, trackColor: '#5b6fe0', posColor: '#5b6fe0' }, col: 'gps &middot; roads',
  ports: [{ id: 'map-cam', side: 't', f: 0.25, ch: 'cam' }, { id: 'map-cam2', side: 'r', f: 0.45, ch: 'cam' }] });
panel({ x: x0, y: y0 + 240, w: 300, h: 120, t: 'Camera frames', sub: 'Gallery', tag: 'filter proposed', draw: 'camera', seed: 5, opts: { boxes: true, boxColor: '#7ed38a' }, col: 'frames',
  ports: [{ id: 'gal-time', side: 'l', f: 0.5, ch: 'time' }] });
panel({ x: x0 + 310, y: y0 + 240, w: 220, h: 120, t: 'Controls spec', sub: 'JSON', fake: '{ "type": "panel.controls",<br>&nbsp;&nbsp;"items": [ 4 controls ] }', col: 'controls.json' });
panel({ x: x0 + 540, y: y0 + 240, w: 232, h: 120, t: 'Controls', sub: 'new', cls: 'prop', tag: 'proposed', fake: 'Time offset &nbsp;&nbsp;&minus;120 ms<i style="width:70%"></i>Show boxes &middot; Follow camera',
  ports: [{ id: 'ctl-time', side: 'r', f: 0.55, ch: 'prop' }] });
panel({ x: x0, y: y0 + 370, w: 772, h: 72, t: 'Front camera', sub: 'Video', tag: 'offset proposed', draw: 'camera', seed: 38, col: 'cam_front',
  ports: [{ id: 'vid-time', side: 'r', f: 0.6, ch: 'prop' }, { id: 'vid-time2', side: 'l', f: 0.6, ch: 'time' }] });
// Debug frame 1280x800 -> 440x275
const DX = 1050, DY = 160;
frame(DX, DY, 460, 290, 'Debug', 'Monitor 2 &middot; 1280&times;800', '#8a7bd8');
panel({ x: DX + 14, y: DY + 14, w: 210, h: 262, t: 'Camera pose', sub: 'JSON', fake: '{ "eye": [-22.0, -14.0, 13.0],<br>&nbsp;&nbsp;"target": [14.0, 2.0, 0.0],<br>&nbsp;&nbsp;"fov": 55 }<i></i><i style="width:60%"></i><i style="width:80%"></i>', col: 'cam',
  ports: [{ id: 'dbg-cam', side: 'l', f: 0.3, ch: 'cam' }] });
panel({ x: DX + 234, y: DY + 14, w: 212, h: 262, t: 'Session', sub: 'Monaco', fake: 'session.specto<i></i><i style="width:70%"></i><i style="width:85%"></i><i style="width:50%"></i><i style="width:75%"></i>', col: 'session' });
// parked in region
panel({ x: 90, y: 690, w: 230, h: 150, t: 'Rear camera', sub: 'Video &middot; parked', draw: 'camera', seed: 44, opts: { dusk: true }, col: 'cam_rear', cls: 'parked', age: '14 min' });
panel({ x: 340, y: 690, w: 180, h: 150, t: 'Gallery v1', sub: 'parked', draw: 'camera', seed: 9, col: 'frames', cls: 'parked', age: '2 h' });
place(el('div', 'sticky', 'GPS drops out<br>0:31 &ndash; 0:36.<br>Check offset<br>vs lidar.'), 545, 692, 118);
place(el('div', 'sticky', 'Try a swipe<br>compare of<br>run 6 vs 7?'), 1080, 660, 120).style.background = '#d9f0f2';
place(el('div', 'sticky', 'Speed plot<br>under the map'), 1240, 680, 120).style.background = '#e6f2d9';
// user annotation driving the next turn
place(el('div', 'selbox'), x0 + 455, y0 - 5, 322, 240);
place(el('div', 'comment', '<div class="who"><span class="av" style="background:#d07a4a;width:18px;height:18px;font-size:10px">Y</span>You &middot; to Scout</div>Line the video up with the lidar on this stretch, then give me a slider.'), 1090, 500);
// Scout cursor with trail
place(el('div', 'cursor', '<svg width="24" height="24" viewBox="0 0 22 22"><path d="M3 2l15 8-6.5 1.8L8.5 19z" fill="#6b5bd2" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="nm">Scout <small>&middot; placing Controls</small></span>'), x0 + 700, y0 + 300);
window.WIRES = [
  { a: '#usd-cam', b: '#map-cam', color: C.cam, w: 2.5, label: 'camera', sideA: 't', sideB: 't', tension: 60, casing: '#fffdfa' },
  { a: '#map-cam2', b: '#dbg-cam', color: C.cam, w: 2.5, label: 'camera', tension: 90, casing: '#fffdfa' },
  { a: '#usd-time', b: '#gal-time', color: C.time, w: 2.5, sideA: 'l', sideB: 'l', tension: 60, label: 'time', casing: '#fffdfa' },
  { a: '#gal-time', b: '#vid-time2', color: C.time, w: 2.5, sideA: 'l', sideB: 'l', tension: 50, casing: '#fffdfa' },
  { a: '#ctl-time', b: '#vid-time', color: C.prop, w: 2.2, dash: '6 5', sideA: 'r', sideB: 'r', tension: 70, label: 'time offset (proposed)', labelColor: '#4b3fa6', labelBg: '#f1eefc', labelBorder: '#c9bff2' },
];
</script>
<script src="common.js"></script>
</body>
</html>
