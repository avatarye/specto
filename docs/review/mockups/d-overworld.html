<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Specto mockup - D Desk Strip - overworld</title>
<style>
:root{
  --text:#e3e7ee; --dim:#9aa3b2; --faint:#6b7486;
  --blue:#4f8ff7; --amber:#f0a92e; --green:#3fbf7f; --agent:#a78bfa;
  --ui:"Segoe UI",system-ui,sans-serif; --mono:"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{background:linear-gradient(160deg,#2b3550,#161a24 70%);font:12.5px/1.4 var(--ui);color:var(--text)}
.win{position:absolute;left:14px;top:12px;width:1572px;height:976px;border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;background:#141821}
.title{height:30px;flex:none;background:#181b22;display:flex;align-items:center;padding-left:12px;color:#8b94a3;font-size:12px}
.title .caps{margin-left:auto;display:flex;height:100%}
.title .caps span{width:46px;display:flex;align-items:center;justify-content:center;color:#aaa}
.desk{flex:1;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 15% 0%,rgba(79,143,247,.20),transparent 60%),radial-gradient(800px 500px at 90% 70%,rgba(240,169,46,.10),transparent 60%),radial-gradient(700px 400px at 50% 100%,rgba(63,191,127,.08),transparent 60%),#121620}
.topbar{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 20px;z-index:5}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;background:rgba(30,35,46,.85);border:1px solid rgba(255,255,255,.08);font-size:12.5px}
.chip.paused{background:rgba(70,52,20,.85);border-color:#6d5426;color:#ffd08a}
.kbd{font:10.5px var(--mono);color:#aab3c1;border:1px solid #4a5363;border-radius:4px;padding:0 5px}
.lane{position:absolute;left:0;right:0}
.lh{position:absolute;left:24px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.lh .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.lh b{font-size:15px;font-weight:600}
.lh .m{color:var(--dim);font-size:12px}
.rule{position:absolute;left:24px;right:0;height:1px}
.fr{position:absolute;z-index:2}
.fr .cap{position:absolute;left:0;right:0;top:-24px;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12.5px}
.fr .cap b{font-weight:600}
.fr .cap .mon{font-size:11px;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:#c6cdd8}
.fr .cap .mon.live{background:rgba(79,143,247,.25);color:#cfe0ff}
.fr .cap .age{margin-left:auto;font-size:11px;color:#c79a54}
.fr .th{position:absolute;inset:0;border-radius:8px;overflow:hidden;background:#1c2028;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);display:grid;gap:3px;padding:3px}
.fr.live .th{box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 2px #e9eef6}
.fr .th>div{position:relative;border-radius:3px;overflow:hidden;background:#262b34}
.fr .th canvas{display:block;width:100%;height:100%;filter:saturate(.6) brightness(.8)}
.fr .th .fk{padding:5px 6px}
.fr .th .fk i{display:block;height:3px;border-radius:2px;background:#3d4553;margin:4px 0}
.cell-agent{box-shadow:inset 0 0 0 2px var(--agent)}
.badge{position:absolute;z-index:4;height:22px;min-width:22px;border-radius:11px;background:var(--agent);color:#1c1530;font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 0 0 3px #121620,0 4px 12px rgba(167,139,250,.4);white-space:nowrap}
.links{position:absolute;z-index:4;display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;background:#252b38;border:1px solid #3d4658;color:#c6cdd8;font-size:11px;white-space:nowrap;transform:translate(-50%,-50%)}
.add{position:absolute;border:1.5px dashed rgba(255,255,255,.18);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;z-index:2}
.shelf{position:absolute;left:24px;display:flex;align-items:center;gap:10px;z-index:2}
.shelf .sl{color:var(--faint);font-size:12px;width:44px}
.sc{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:8px;background:rgba(36,41,52,.9);border:1px solid rgba(255,255,255,.07);font-size:12px}
.sc .tn{width:56px;height:32px;border-radius:4px;overflow:hidden;background:#2b313c}
.sc .tn canvas{display:block;width:100%;height:100%;filter:saturate(.5) brightness(.75)}
.sc .s{color:var(--dim);font-size:11px}
.fade{position:absolute;right:0;top:0;bottom:0;width:120px;background:linear-gradient(90deg,transparent,#121620);z-index:3}
.changes{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:12px;padding:9px 12px 9px 16px;border-radius:12px;background:rgba(30,26,46,.95);border:1px solid #4a3f72;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap}
.changes .it{display:flex;align-items:center;gap:7px;padding:3px 10px;border-radius:7px;background:rgba(167,139,250,.12);color:#ddd2ff;font-size:12px}
.changes .dot{width:9px;height:9px;border-radius:3px}
.btn{padding:5px 14px;border-radius:8px;background:var(--agent);color:#1c1530;font-weight:700}
.btn2{padding:5px 12px;border-radius:8px;background:rgba(255,255,255,.08);color:#d8dde6}
</style>
</head>
<body>
<div class="win">
  <div class="title">Specto &mdash; Overworld<div class="caps"><span>&#8212;</span><span>&#9744;</span><span>&#10005;</span></div></div>
  <div class="desk" id="desk">
    <div class="topbar">
      <span class="chip" style="font-weight:700;letter-spacing:.1em">OVERWORLD</span>
      <span class="chip paused"><svg width="10" height="11"><rect x="0" y="0" width="3.5" height="11" rx="1" fill="#ffd08a"/><rect x="6.5" y="0" width="3.5" height="11" rx="1" fill="#ffd08a"/></svg>Paused &middot; every frame is a snapshot</span>
      <span style="margin-left:auto;color:var(--dim)">3 projects &middot; 9 frames</span>
      <span class="chip"><span class="kbd">Alt+&uarr;/&darr;</span> project <span class="kbd">Alt+&larr;/&rarr;</span> frame <span class="kbd">Space</span> open frame to edit wires</span>
    </div>
  </div>
</div>
<script>
const desk = document.getElementById('desk');
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function place(e, x, y, w, h) { Object.assign(e.style, { left: x + 'px', top: y + 'px' }); if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; desk.appendChild(e); return e; }
function cv(draw, seed, opts) { return `<canvas data-draw="${draw}" data-seed="${seed}" ${opts ? `data-opts='${JSON.stringify(opts)}'` : ''}></canvas>`; }
const fake = n => `<div class="fk">${Array.from({ length: n }, (_, i) => `<i style="width:${50 + ((i * 37) % 45)}%"></i>`).join('')}</div>`;
function lane(y, name, color, meta, icon) {
  place(el('div', 'lh', `<span class="ic" style="background:${color}">${icon}</span><b>${name}</b><span class="m">${meta}</span>`), 0, y);
  const r = place(el('div', 'rule'), 0, y + 36); r.style.background = `linear-gradient(90deg,${color}88,transparent 70%)`;
}
function frame(o) {
  const f = place(el('div', 'fr' + (o.live ? ' live' : '')), o.x, o.y, o.w, o.h);
  f.appendChild(el('div', 'cap', `<b>${o.name}</b><span class="mon${o.live ? ' live' : ''}">${o.mon}</span><span class="age">${o.age || '0:09'}</span>`));
  const th = el('div', 'th'); th.style.gridTemplateColumns = o.cols; th.style.gridTemplateRows = o.rows;
  th.innerHTML = o.cells.map(c => `<div class="${c.a ? 'cell-agent' : ''}" style="${c.s || ''}">${c.h}</div>`).join('');
  f.appendChild(th);
  if (o.badge) { const b = place(el('div', 'badge', o.badge), o.x + o.w - 8, o.y + 8); b.style.zIndex = 5; b.style.transform = 'translateX(-100%)'; }
  if (o.dim) f.style.opacity = o.dim;
}
// ---------- lane 1: robotA
const L1 = 58;
lane(L1, 'robotA', 'var(--blue)', '3 frames &middot; 9 widgets &middot; 5 links', '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="8" cy="8" r="1.6" fill="#fff"/></svg>');
const FH = 196, FY1 = L1 + 76;
frame({ x: 48, y: FY1, w: 348, h: FH, name: 'Review', mon: 'Monitor 1 &middot; on screen', live: true, badge: 'agent +1', cols: '1.45fr 1fr 0.85fr', rows: '1.7fr 1fr 0.7fr',
  cells: [
    { h: cv('cloud', 3, { bg: '#1a1e26', cmap: 'ice', size: 0.8, gizmo: false, by: 'mixed', density: 0.5 }), s: 'grid-column:span 1' },
    { h: cv('map', 6, { theme: 'slate', block: 22, chrome: false, labelSize: 6, trackColor: '#4f8ff7' }), s: 'grid-column:span 2' },
    { h: cv('camera', 5) },
    { h: fake(5) },
    { h: fake(4), a: true },
    { h: cv('camera', 38), s: 'grid-column:span 3' },
  ] });
frame({ x: 446, y: FY1, w: 314, h: FH, name: 'Debug', mon: 'Monitor 2', cols: '1.4fr 1fr', rows: '1.4fr 1fr',
  cells: [{ h: fake(8), s: 'grid-row:span 2' }, { h: `<svg width="100%" height="100%" viewBox="0 0 100 50" preserveAspectRatio="none"><polyline fill="none" stroke="#6b8bb8" stroke-width="1.5" points="0,42 12,38 25,30 38,33 50,22 62,19 75,25 88,12 100,15"/></svg>` }, { h: fake(4) }] });
frame({ x: 810, y: FY1, w: 348, h: FH, name: 'Compare', mon: 'unbound', cols: '1fr 1fr', rows: '1fr',
  cells: [{ h: cv('camera', 21) }, { h: cv('camera', 22, { dusk: true }) }] });
place(el('div', 'add', '+ frame'), 1208, FY1, 130, FH);
// link counts on frame edges
place(el('div', 'links', '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M7 9l2-2M6 11l-1 1a2 2 0 01-3-3l2-2a2 2 0 013 0M10 5l1-1a2 2 0 013 3l-2 2a2 2 0 01-3 0" fill="none" stroke="#c6cdd8" stroke-width="1.5"/></svg>2'), 421, FY1 + FH / 2);
place(el('div', 'links', '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M7 9l2-2M6 11l-1 1a2 2 0 01-3-3l2-2a2 2 0 013 0M10 5l1-1a2 2 0 013 3l-2 2a2 2 0 01-3 0" fill="none" stroke="#c6cdd8" stroke-width="1.5"/></svg>1'), 785, FY1 + FH / 2);
place(el('div', 'links', 'time<br>cam'), 421, FY1 + FH / 2 + 26).style.cssText += ';background:transparent;border:none;color:#8b94a3;font-size:10.5px';
place(el('div', 'links', 'time'), 785, FY1 + FH / 2 + 26).style.cssText += ';background:transparent;border:none;color:#8b94a3;font-size:10.5px';
// shelf
const S1 = FY1 + FH + 18;
place(el('div', 'shelf', `<span class="sl">shelf</span>
  <span class="sc"><span class="tn">${cv('camera', 44, { dusk: true })}</span><span>Video v9<br><span class="s">rear cam &middot; run 7</span></span></span>
  <span class="sc"><span class="tn">${cv('camera', 9)}</span><span>Gallery v1<br><span class="s">parked 2 h</span></span></span>
  <span class="sc"><span class="tn" style="padding:4px 5px">${fake(3).replace('class="fk"', 'class="fk" style="padding:0"')}</span><span>Log v7<br><span class="s">parked</span></span></span>`), 0, S1);
// ---------- lane 2: survey22
const L2 = S1 + 74;
lane(L2, 'survey22', 'var(--amber)', '4 frames &middot; photogrammetry + splats', '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M2 13l4-8 3 5 2-3 3 6z" fill="#fff"/></svg>');
const FY2 = L2 + 76;
frame({ x: 48, y: FY2, w: 348, h: FH, name: 'Tiles', mon: 'unbound', age: '3 h', cols: 'repeat(4,1fr)', rows: 'repeat(3,1fr)',
  cells: Array.from({ length: 12 }, (_, i) => ({ h: cv('camera', 60 + i, i % 3 === 0 ? { dusk: true } : null) })) });
frame({ x: 446, y: FY2, w: 348, h: FH, name: 'Map 3D', mon: 'unbound', age: '3 h', badge: 'agent ~1', cols: '1fr', rows: '1fr',
  cells: [{ h: cv('cloud', 9, { bg: '#1b1d22', bg2: '#262a33', cmap: 'viridis', size: 1.1, gizmo: false, eye: [-26, -22, 22], target: [18, 0, 0], density: 0.6 }), a: true }] });
frame({ x: 844, y: FY2, w: 348, h: FH, name: 'Splat v2', mon: 'unbound', age: '3 h', cols: '1fr 0.4fr', rows: '1fr',
  cells: [{ h: cv('cloud', 12, { bg: '#20222a', cmap: 'turbo', size: 1.4, gizmo: false, by: 'intensity', eye: [-15, -20, 9], alpha: 0.5 }) }, { h: fake(7) }] });
frame({ x: 1242, y: FY2, w: 348, h: FH, name: 'Compare tiles', mon: 'unbound', age: '1 d', cols: '1fr 1fr', rows: '1fr',
  cells: [{ h: cv('camera', 70) }, { h: cv('camera', 71, { dusk: true }) }] });
place(el('div', 'fade'), 0, FY2 - 30, null, FH + 40).style.left = 'auto';
place(el('div', 'shelf', '<span class="sl">shelf</span><span style="color:var(--faint);font-size:12px">(empty)</span>'), 0, FY2 + FH + 18);
// ---------- lane 3: collapsed
const L3 = FY2 + FH + 70;
lane(L3, 'warehouse-sim', 'var(--green)', '2 frames &middot; collapsed', '<svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="6" width="12" height="8" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M1 7l7-5 7 5" fill="none" stroke="#fff" stroke-width="1.8"/></svg>');
place(el('div', 'shelf', `<span class="sl"></span>
  <span class="sc"><span class="tn">${cv('cloud', 21, { bg: '#1b1d22', cmap: 'turbo', size: 0.6, gizmo: false })}</span><span>Sim run<br><span class="s">Monitor 3 &middot; 0:09</span></span></span>
  <span class="sc"><span class="tn">${cv('map', 9, { theme: 'slate', block: 10, chrome: false, labelSize: 4 })}</span><span>Fleet map<br><span class="s">unbound</span></span></span>
  <span style="color:var(--faint);font-size:12px">Alt+&darr; to expand</span>`), 0, L3 + 48);
// change list
place(el('div', 'changes', `<span style="font-weight:600;color:#ece6ff">Agent changed</span>
  <span class="it"><span class="dot" style="background:var(--blue)"></span>robotA / Review &middot; + Controls</span>
  <span class="it"><span class="dot" style="background:var(--amber)"></span>survey22 / Map 3D &middot; ~ camera bookmark</span>
  <span class="btn">Review 2</span><span class="btn2">Revert all</span>`), 0, 0).style.cssText += ';left:50%;top:auto';
</script>
<script src="common.js"></script>
</body>
</html>
