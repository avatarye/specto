[project]
name = "specto-sdk"
version = "0.2.0"
description = "Specto SDK: Python client over JSON-RPC to a running app (remote mode only)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["specto-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specto_sdk"]
