[project]
name = "specto-web"
version = "0.2.0"
description = "Specto web panels: Monaco JSON view, changeset diff, channel bridge. Static assets plus a tiny locator package; Monaco is vendored offline by build.py."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specto_web"]

# A wheel carries the pages and the vendored Monaco next to the locator module.
[tool.hatch.build.targets.wheel.force-include]
"web" = "specto_web/web"
