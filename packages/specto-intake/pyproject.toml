[project]
name = "specto-intake"
version = "0.2.0"
description = "Specto intake: sources, screener, keys, grouping, sort. No Qt."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["specto-core", "specto-readers", "platformdirs>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specto_intake"]
