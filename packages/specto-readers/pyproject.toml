[project]
name = "specto-readers"
version = "0.2.0"
description = "Specto readers: built-in locators and decoders (images, JSON, text, USD headers, joint tracks), xacro expansion and the worker pool."
requires-python = ">=3.12,<3.13"
license = "MIT"
# pyarrow is a base dependency, not an extra: the urdf view's joint tracks (CSV, Parquet)
# would fail on a default install, and every setup command would need a third extra.
# xacro stays below 2.2: its file reads must go through the bare open() the gate
# shadows (test_xacro_reads_files_only_through_the_bare_open).
dependencies = ["specto-core", "numpy>=2.0", "pillow>=10.4", "pyarrow>=18", "xacro>=2.1.1,<2.2", "trimesh>=4.4", "pycollada>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specto_readers"]
