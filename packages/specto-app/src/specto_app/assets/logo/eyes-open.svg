<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 52 52">
  <!-- Eyes at rest. Same 100-unit grid as s-body.svg. Colour: theme "agent". E4 places them as two circles r 6, the right eye 1.1 units higher than the left. Move both eyes together by an offset inside the ELLIPSE with semi-axes (6, 7) units (not a box: at the box corners the eyes reach the arc). At least 2.63 units clear on rev 4.0. -->
  <g id="mark" transform="translate(6.24 6.24) scale(0.3952)">
    <circle id="eye-left" cx="51.2" cy="40.7" r="6" fill="#B86A2B"/>
    <circle id="eye-right" cx="65" cy="39.6" r="6" fill="#B86A2B"/>
  </g>
</svg>
