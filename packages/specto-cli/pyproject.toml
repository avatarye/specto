[project]
name = "specto-cli"
version = "0.2.0"
description = "Specto CLI: click commands generated from the registry."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["specto-sdk", "specto-plugin", "click>=8.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specto_cli"]
[project.scripts]
specto = "specto_cli.main:main"
