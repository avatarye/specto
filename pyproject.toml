[project]
name = "specto-workspace"
version = "0.2.0"
description = "Specto monorepo (uv workspace). Not a distributable package."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "specto-core",
    "specto-intake",
    "specto-readers",
    "specto-sdk",
    "specto-cli",
    "specto-mcp",
    "specto-app",
    "specto-web",
    "specto-plugin",
]

[project.optional-dependencies]
# `uv sync --extra rtx`: the usd view renders with RTX (ovrtx, #137)
rtx = ["specto-app[rtx]"]
# `uv sync --extra storm`: kept for old commands; Storm's packages are base dependencies (#143)
storm = ["specto-app[storm]"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
# yourdfpy (the urdf view's parser) asks for trimesh[easy]; Specto only parses URDF with it
# (no meshes loaded, no scene graph), so plain trimesh: no GPL/LGPL or heavy extras
override-dependencies = ["trimesh>=3.11.2"]

# Public PyPI only. Project indexes are searched before any user-level uv.toml index,
# so a private index there is never consulted (no auth, no leaked package names).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
specto-core = { workspace = true }
specto-intake = { workspace = true }
specto-readers = { workspace = true }
specto-sdk = { workspace = true }
specto-cli = { workspace = true }
specto-mcp = { workspace = true }
specto-app = { workspace = true }
specto-web = { workspace = true }
specto-plugin = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:specto_.*"]
markers = [
    "ovrtx: renders with NVIDIA ovrtx on this machine's GPU (skipped without the rtx extra)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src"]
extend-exclude = ["testdata", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "SIM108"]

[tool.ruff.lint.flake8-bugbear]
# pydantic Field() as a parameter default is how MCP tool schemas carry descriptions
extend-immutable-calls = ["pydantic.Field"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "SIM"]
